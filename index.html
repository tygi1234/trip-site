<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gilkison Family Trip — Paris & Swiss Alps 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 16px;
    padding: 32px 28px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .flag { font-size: 36px; margin-bottom: 4px; }
  h1 { font-size: 22px; font-weight: 800; color: #f0c040; margin-bottom: 4px; }
  .dates { color: #7d8590; font-size: 14px; margin-bottom: 28px; }
  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #21262d;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 18px 20px;
    text-decoration: none;
    color: #e6edf3;
    margin-bottom: 12px;
    transition: all 0.15s;
    text-align: left;
  }
  .link-btn:hover { background: #2d333b; border-color: #f0c040; }
  .link-btn .icon { font-size: 28px; flex-shrink: 0; }
  .link-btn .info { flex: 1; }
  .link-btn .title { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
  .link-btn .sub { font-size: 12px; color: #7d8590; }
  .link-btn .arrow { color: #7d8590; font-size: 18px; }
  .link-btn:hover .arrow { color: #f0c040; }
  .footer { margin-top: 24px; font-size: 12px; color: #484f58; }
</style>
</head>
<body>
<div class="card">
  <div class="flag">🗼🏔️</div>
  <h1>Gilkison Family Trip</h1>
  <div class="dates">Paris & Swiss Alps · June 18–27, 2026</div>

  <a href="missions.html" class="link-btn">
    <span class="icon">🕵️</span>
    <span class="info">
      <div class="title">Agent Owen — Mission Log</div>
      <div class="sub">50 missions · Tap to check off as you go</div>
    </span>
    <span class="arrow">›</span>
  </a>

  <a href="itinerary.html" class="link-btn">
    <span class="icon">📋</span>
    <span class="info">
      <div class="title">Full Trip Itinerary</div>
      <div class="sub">Day-by-day schedule, restaurants & booking info</div>
    </span>
    <span class="arrow">›</span>
  </a>

  <div class="footer">Share this link with your family · Works on any phone</div>
</div>
</body>
</html>
